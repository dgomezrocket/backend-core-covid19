server.port=${PORT:9900}

spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/covid19}
spring.datasource.username=${DATABASE_USERNAME:covid19}
spring.datasource.password=${DATABASE_PASSWORD:covid19}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Configuración de email - Puerto 587 con STARTTLS
mail.smtp.host=${MAIL_SMTP_HOST:smtp.gmail.com}
mail.smtp.port=${MAIL_SMTP_PORT:587}
mail.smtp.user=${MAIL_SMTP_USER:}
mail.smtp.pass=${MAIL_SMTP_PASS:}

url.backend=${URL_BACKEND:http://localhost:9900}
url.frontend=${URL_FRONTEND:http://localhost:8081}